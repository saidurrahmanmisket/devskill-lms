<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient (Vibrant JS Amber-Yellow) -->
    <linearGradient id="js_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B" />
      <stop offset="50%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    
    <!-- Spherical Highlight -->
    <radialGradient id="js_highlight" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="js_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#F57F17" flood-opacity="0.45" />
    </filter>
    
    <!-- JS typography Filter -->
    <filter id="js_bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.5" flood-color="#5D4037" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circle with Shadow -->
  <circle cx="50" cy="50" r="42" fill="url(#js_bg)" filter="url(#js_shadow)" />
  
  <!-- Outer Bevel Ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Stylized JS Typography (Dark Charcoal) -->
  <g filter="url(#js_bevel)">
    <!-- J letter -->
    <path d="M 44 42 L 44 59 C 44 65 37 66 33 62 C 31 60 30 56 31 54" fill="none" stroke="#1A1824" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- S letter -->
    <path d="M 68 44 C 65 41 57 41 56 46 C 55 51 68 52 67 60 C 66 65 58 66 54 62 C 52 60 51 57 51 55" fill="none" stroke="#1A1824" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small decorative 3D sparkles -->
    <polygon points="73,31 75,36 80,38 75,40 73,45 71,40 66,38 71,36" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Spherical Top Glaze Highlight -->
  <ellipse cx="44" cy="30" rx="22" ry="13" fill="url(#js_highlight)" transform="rotate(-15 44 30)" />
</svg>
