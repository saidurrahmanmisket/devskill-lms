<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="web_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#D83A00" />
    </linearGradient>
    
    <!-- Spherical Highlight -->
    <radialGradient id="web_highlight" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="web_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.38" />
    </filter>
    
    <!-- Code Symbol Filter -->
    <filter id="web_bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#A52700" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circle with Shadow -->
  <circle cx="50" cy="50" r="42" fill="url(#web_bg)" filter="url(#web_shadow)" />
  
  <!-- Outer Bevel Ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- Stylized 3D Code Brackets & Slash -->
  <g filter="url(#web_bevel)">
    <!-- Left Bracket < -->
    <path d="M 38 38 L 27 50 L 38 62" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M 54 36 L 46 64" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 62 38 L 73 50 L 62 62" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mini decorative dots top right -->
    <circle cx="71" cy="30" r="2.5" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="64" cy="27" r="2" fill="#FFFFFF" fill-opacity="0.6" />
  </g>

  <!-- Spherical Top Glaze Highlight -->
  <ellipse cx="44" cy="30" rx="22" ry="13" fill="url(#web_highlight)" transform="rotate(-15 44 30)" />
</svg>
