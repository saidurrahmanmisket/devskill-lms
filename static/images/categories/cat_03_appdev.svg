<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="app_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14D8C4" />
      <stop offset="50%" stop-color="#0FAE9A" />
      <stop offset="100%" stop-color="#087F73" />
    </linearGradient>
    
    <!-- Spherical Highlight -->
    <radialGradient id="app_highlight" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="app_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0FAE9A" flood-opacity="0.38" />
    </filter>
    
    <!-- Phone Symbol Filter -->
    <filter id="app_bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#044D45" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Circle with Shadow -->
  <circle cx="50" cy="50" r="42" fill="url(#app_bg)" filter="url(#app_shadow)" />
  
  <!-- Outer Bevel Ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- 3D Smartphone & Floating App Elements -->
  <g filter="url(#app_bevel)">
    <!-- Phone body -->
    <rect x="36" y="27" width="28" height="46" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3.8" />
    
    <!-- Speaker notch -->
    <line x1="46" y1="32" x2="54" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- App UI Grid on Screen -->
    <rect x="42" y="38" width="6" height="6" rx="1.5" fill="#FFFFFF" />
    <rect x="52" y="38" width="6" height="6" rx="1.5" fill="#FFFFFF" />
    <rect x="42" y="48" width="6" height="6" rx="1.5" fill="#FFFFFF" />
    <rect x="52" y="48" width="6" height="6" rx="1.5" fill="#FFFFFF" />
    
    <!-- Home Bar / Indicator -->
    <line x1="45" y1="66" x2="55" y2="66" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Floating side pulse ring -->
    <circle cx="70" cy="38" r="3" fill="#FFFFFF" fill-opacity="0.85" />
    <circle cx="28" cy="56" r="2.5" fill="#FFFFFF" fill-opacity="0.75" />
  </g>

  <!-- Spherical Top Glaze Highlight -->
  <ellipse cx="44" cy="30" rx="22" ry="13" fill="url(#app_highlight)" transform="rotate(-15 44 30)" />
</svg>
