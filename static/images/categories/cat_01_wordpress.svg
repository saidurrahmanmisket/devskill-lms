<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wp_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3880FF" />
      <stop offset="50%" stop-color="#1E54B7" />
      <stop offset="100%" stop-color="#0F2B66" />
    </linearGradient>
    
    <!-- Spherical Highlight -->
    <radialGradient id="wp_highlight" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="wp_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E54B7" flood-opacity="0.35" />
    </filter>
    
    <!-- Inner Shadow for 3D depth -->
    <filter id="wp_bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Circle with Shadow -->
  <circle cx="50" cy="50" r="42" fill="url(#wp_bg)" filter="url(#wp_shadow)" />
  
  <!-- Outer Bevel Ring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
  
  <!-- WordPress W Symbol -->
  <g filter="url(#wp_bevel)">
    <!-- Outer W circle -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Stylized W Paths -->
    <path d="M 33 39 L 43 65 L 48 51 L 43 39" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 47 39 L 52 53 L 57 39" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 56 51 L 61 65 L 68 39" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 31 39 L 37 39 M 64 39 L 70 39" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" />
  </g>

  <!-- Spherical Top Glaze Highlight -->
  <ellipse cx="44" cy="30" rx="22" ry="13" fill="url(#wp_highlight)" transform="rotate(-15 44 30)" />
</svg>
